[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vaporpkg"
version = "0.1.0"
description = "Catch AI-hallucinated (slopsquatting) and suspicious PyPI/npm packages before you install them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Varshith" }]
keywords = ["security", "supply-chain", "slopsquatting", "typosquatting", "llm", "pypi", "npm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
    "Environment :: Console",
]
dependencies = ["tomli>=2; python_version < '3.11'"]  # otherwise standard library only

[project.optional-dependencies]
dev = ["pytest>=7"]
bench = ["matplotlib>=3.7"]

[project.scripts]
vaporpkg = "vaporpkg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaporpkg = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the real PyPI/npm registries (run with VAPORPKG_NETWORK_TESTS=1)"]
